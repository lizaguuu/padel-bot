name: padel-watch

on:
  schedule:
    # Запуск каждые 10 минут; каждый запуск сам проверяет раз в минуту ~20 минут.
    # Пока один запуск работает, следующий ждёт в очереди — получается непрерывно.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths: ["padel_watch.py", ".github/workflows/padel.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим: check / --test / --dump"
        default: "check"

concurrency:
  group: padel-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            chat_id.txt
            error.txt
          key: padel-state-${{ github.run_id }}
          restore-keys: padel-state-

      - name: Check Playtomic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "check" ]; then
            python padel_watch.py --loop 60 1200
          else
            python padel_watch.py "$MODE"
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            chat_id.txt
            error.txt
          key: padel-state-${{ github.run_id }}
