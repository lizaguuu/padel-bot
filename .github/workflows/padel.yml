name: padel-watch

on:
  # Расписание выключено: Playtomic блокирует серверы GitHub (HTTP 403).
  # Бот работает на MacBook (файл padel-bot.command).
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим: check / --test / --dump"
        default: "check"

concurrency:
  group: padel-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            chat_id.txt
            error.txt
          key: padel-state-v2-${{ github.run_id }}
          restore-keys: padel-state-v2-

      - name: Check Playtomic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "check" ]; then
            python padel_watch.py --loop 60 1200
          else
            python padel_watch.py "$MODE"
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            chat_id.txt
            error.txt
          key: padel-state-v2-${{ github.run_id }}
